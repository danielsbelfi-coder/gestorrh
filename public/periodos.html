<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestorRH - Periodos de remuneración</title>
    <link rel="stylesheet" href="css/app.css">
</head>

<body>
    <main class="contenido" data-empresa data-titulo="Periodos de remuneración">
        <div class="encabezado-pagina">
            <div>
                <h1>Periodos de remuneración</h1>
                <p>Meses de remuneraciones de la empresa. Por defecto se muestran los abiertos.</p>
            </div>
        </div>
        <p id="mensajeError" role="alert"></p>
        <p id="mensajeInfo" role="status"></p>
        <ul id="listaProblemas"></ul>

        <details class="tarjeta plegable" id="panelCrear">
            <summary>＋ Abrir periodo</summary>
            <form id="formCrearPeriodos">
                <label>Mes<select id="mes" required></select></label>
                <label>Año<input type="number" id="anio" min="2000" max="2100" class="campo-corto" required></label>
                <label>Fecha de apertura<input type="date" id="fechaApertura" required></label>
                <button type="submit">Abrir periodo</button>
            </form>
        </details>

        <div id="tablaPeriodos"></div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/componentes.js"></script>
    <script src="js/periodos.js"></script>
</body>

</html>
