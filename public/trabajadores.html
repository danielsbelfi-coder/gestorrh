<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestorRH - Trabajadores</title>
    <link rel="stylesheet" href="css/app.css">
</head>

<body>
    <main class="contenido" data-empresa data-titulo="Trabajadores">
        <div class="encabezado-pagina">
            <div>
                <h1>Trabajadores</h1>
                <p>Relaciones laborales de la empresa: postulantes, activos y extrabajadores.</p>
            </div>
        </div>
        <p id="mensajeError" role="alert"></p>
        <p id="mensajeInfo" role="status"></p>
        <ul id="listaProblemas"></ul>

        <details class="tarjeta plegable" id="panelCrear">
            <summary>＋ Nuevo postulante</summary>
            <form id="formCrearTrabajador">
                <label class="campo-ancho">Persona<input type="search" id="persona" placeholder="Escribe nombre o RUT…" required></label>
                <label>Fecha de ingreso<input type="date" id="fechaIngreso" required></label>
                <button type="submit">Crear</button>
            </form>
        </details>

        <div id="tablaTrabajadores"></div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/componentes.js"></script>
    <script src="js/trabajadores.js"></script>
</body>

</html>
