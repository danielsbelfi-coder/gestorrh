<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestorRH - Consumo del plan</title>
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/app.css">
</head>

<body>
    <main class="contenido" data-titulo="Consumo del plan">
        <a class="volver-lista" href="cuentas.html" id="volverCuentas" hidden>← Volver a Cuentas</a>
        <div class="encabezado-pagina">
            <div>
                <h1>Consumo del plan</h1>
                <p>Uso de la cuenta frente a lo que incluye el plan, y el valor mensual. Se cobra por trabajadores contratados en el mes, con empresas ilimitadas.</p>
            </div>
            <div class="selector-mes">
                <label>Mes<select id="mes"></select></label>
                <label>Año<input type="number" id="anio" min="2000" max="2100" class="campo-corto"></label>
            </div>
        </div>
        <p id="mensajeError" role="alert"></p>
        <p id="mensajeInfo" role="status"></p>

        <div class="rejilla rejilla-ancha">
            <section class="tarjeta">
                <h2>Plan <span id="nombrePlan"></span></h2>
                <div id="usoPlan"></div>
            </section>
            <section class="tarjeta">
                <h2>Valor mensual</h2>
                <div id="precioPlan"></div>
            </section>
        </div>
    </main>


    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/componentes.js"></script>
    <script src="js/consumo.js"></script>
</body>

</html>
