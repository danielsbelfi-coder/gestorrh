<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestorRH - Contratos</title>
    <link rel="stylesheet" href="css/app.css">
</head>

<body>
    <main class="contenido" data-empresa data-titulo="Contratos">
        <div class="encabezado-pagina">
            <div>
                <h1>Contratos</h1>
                <p>Contratos de trabajo de la empresa y sus condiciones.</p>
            </div>
        </div>
        <p id="mensajeError" role="alert"></p>
        <p id="mensajeInfo" role="status"></p>
        <ul id="listaProblemas"></ul>

        <details class="tarjeta plegable" id="panelCrear">
            <summary>＋ Nuevo contrato</summary>
            <form id="formCrearContratos">
                <label class="campo-ancho">Trabajador<input type="search" id="trabajador" placeholder="Escribe nombre o RUT…" required></label>
                <label>Tipo de contrato
                    <select id="tipoContrato">
                        <option value="indefinido">Indefinido</option>
                        <option value="plazo_fijo">Plazo fijo</option>
                        <option value="obra_faena">Obra o faena</option>
                    </select>
                </label>
                <label>Fecha de inicio<input type="date" id="fechaInicio" required></label>
                <label>Cargo<select id="cargoId" required></select></label>
                <label class="campo-ancho">Funciones<input type="text" id="funciones" required></label>
                <label class="campo-ancho">Lugar de prestación de servicios<input type="text" id="lugarPrestacionServicios" required></label>
                <label>Jornada
                    <select id="tipoJornada">
                        <option value="completa">Completa</option>
                        <option value="parcial">Parcial</option>
                        <option value="excluido_limitacion">Excluido de limitación</option>
                    </select>
                </label>
                <label>Horas semanales<input type="number" id="horasSemanales" min="1" step="0.5" required></label>
                <label>Días trabajados por semana<input type="number" id="diasTrabajados" min="1" max="7" required></label>
                <label>Sistema de remuneración
                    <select id="sistemaRemuneracion">
                        <option value="mensual">Mensual</option>
                        <option value="diario">Diario</option>
                        <option value="semanal">Semanal</option>
                        <option value="hora">Por hora</option>
                    </select>
                </label>
                <label>Sueldo base<input type="number" id="sueldoBase" min="0" required></label>
                <label>Periodicidad de pago
                    <select id="periodicidadPago">
                        <option value="mensual">Mensual</option>
                        <option value="quincenal">Quincenal</option>
                        <option value="semanal">Semanal</option>
                    </select>
                </label>
                <button type="submit">Crear contrato</button>
            </form>
        </details>

        <div id="tablaContratos"></div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/componentes.js"></script>
    <script src="js/contratos.js"></script>
</body>

</html>
