<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>GestorRH - Cambiar contraseña</title>
</head>

<body>
    <h1>Cambiar Contraseña</h1>
    <form id="formCambiarPassword">
        <input type="password" id="passwordActual" placeholder="Contraseña actual" required>
        <input type="password" id="passwordNueva" placeholder="Contraseña nueva" minlength="8" required>
        <input type="password" id="passwordConfirmacion" placeholder="Repite la contraseña nueva" minlength="8"
            required>
        <button type="submit">Cambiar Contraseña</button>
    </form>
    <p id="mensaje"></p>

    <script src="js/api.js"></script>
    <script src="js/cambiar-password.js"></script>

</body>

</html>
