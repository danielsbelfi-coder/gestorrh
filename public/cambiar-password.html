<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestorRH - Cambiar contraseña</title>
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/app.css">
</head>

<body>
    <div class="acceso-centrado">
        <div class="acceso-tarjeta">
            <a class="lateral-marca marca-oscura" href="index.html"><span class="marca-logo">RH</span><span>GestorRH</span></a>
            <h2>Cambiar contraseña</h2>
            <p>Usa al menos 8 caracteres.</p>
            <p id="mensaje" role="status"></p>
            <form id="formCambiarPassword">
                <label>Contraseña actual
                    <input type="password" id="passwordActual" autocomplete="current-password" required>
                </label>
                <label>Contraseña nueva
                    <input type="password" id="passwordNueva" minlength="8" autocomplete="new-password" required>
                </label>
                <label>Repite la contraseña nueva
                    <input type="password" id="passwordConfirmacion" minlength="8" autocomplete="new-password" required>
                </label>
                <button type="submit">Cambiar contraseña</button>
            </form>
            <a class="volver" href="index.html">Volver al inicio</a>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/cambiar-password.js"></script>
</body>

</html>
