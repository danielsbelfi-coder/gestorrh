<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestorRH - Liquidaciones</title>
    <link rel="stylesheet" href="css/app.css">
</head>

<body>
    <main class="contenido" data-empresa data-titulo="Liquidaciones">
        <h1>Liquidaciones</h1>
        <p id="mensajeInfo"></p>
        <p id="mensajeError"></p>
        <ul id="listaProblemas"></ul>
        <select id="periodo"></select>

        <div>
            <button id="btnEmitirTodas">Cerrar todas</button>
            <button id="btnPdfTodas">PDF de todas</button>
            <button id="btnPdfTodasAportes">PDF de todas con aportes</button>
            <button id="btnPrevired">Archivo Previred</button>
            <button id="btnLre">Archivo LRE</button>
        </div>

        <ul id="listaLiquidaciones"></ul>

        <form id="formCalcular">
            <label class="campo-ancho">Calcular la liquidación de<input type="search" id="trabajador" placeholder="Escribe nombre o RUT…" required></label>
            <button type="submit">Calcular</button>
        </form>

    </main>


    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/componentes.js"></script>
    <script src="js/liquidaciones.js"></script>
</body>

</html>
