<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestorRH - Liquidaciones</title>
    <link rel="stylesheet" href="css/app.css">
</head>

<body>
    <main class="contenido" data-empresa data-titulo="Liquidaciones">
        <div class="encabezado-pagina">
            <div>
                <h1>Liquidaciones</h1>
                <p>Calcula, revisa y cierra las liquidaciones de sueldo del periodo.</p>
            </div>
            <label>Periodo<select id="periodo"></select></label>
        </div>
        <p id="mensajeError" role="alert"></p>
        <p id="mensajeInfo" role="status"></p>
        <ul id="listaProblemas"></ul>

        <section class="tarjeta barra-acciones">
            <form id="formCalcular">
                <label class="campo-ancho">Calcular la liquidación de<input type="search" id="trabajador" placeholder="Escribe nombre o RUT…" required></label>
                <button type="submit">Calcular</button>
            </form>
            <div class="acciones-grupo">
                <button type="button" id="btnCalcularTodas" class="secundario">Calcular todas</button>
                <button type="button" id="btnEmitirTodas">Cerrar todas</button>
                <button type="button" id="btnPdfTodas" class="secundario">PDF de todas</button>
                <button type="button" id="btnPdfTodasAportes" class="secundario">PDF con aportes</button>
            </div>
        </section>

        <div id="tablaLiquidaciones"></div>

        <section class="tarjeta detalle" id="detalle" hidden></section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/componentes.js"></script>
    <script src="js/liquidaciones.js"></script>
</body>

</html>
