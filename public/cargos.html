<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestorRH - Cargos</title>
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/app.css">
</head>

<body>
    <main class="contenido" data-empresa data-titulo="Cargos">
        <div class="encabezado-pagina">
            <div>
                <h1>Cargos</h1>
                <p>Cargos de la empresa y cuántos trabajadores tienen un contrato vigente en cada uno.</p>
            </div>
        </div>
        <p id="mensajeError" role="alert"></p>
        <p id="mensajeInfo" role="status"></p>
        <ul id="listaProblemas"></ul>

        <details class="tarjeta plegable" id="panelCrear">
            <summary>＋ Nuevo cargo</summary>
            <form id="formCrearCargo">
                <label>Nombre<input type="text" id="nombre" required></label>
                <label>Departamento (id, opcional)<input type="text" id="departamentoId"></label>
                <label class="campo-ancho">Descripción (opcional)<input type="text" id="descripcion"></label>
                <button type="submit">Crear cargo</button>
            </form>
        </details>

        <div id="tablaCargos"></div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/componentes.js"></script>
    <script src="js/cargos.js"></script>
</body>

</html>
