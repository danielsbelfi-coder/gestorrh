<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestorRH - Cargos</title>
    <link rel="stylesheet" href="css/app.css">
</head>

<body>
    <main class="contenido" data-empresa data-titulo="Cargos">
        <h1>Cargos</h1>
        <p id="mensajeError"></p>

        <ul id="listaCargos"></ul>

        <h2>Crear cargos</h2>
        <form id="formCrearCargo">
            <input type="text" id="nombre" placeholder="Nombre" required>
            <input type="text" id="departamentoId" placeholder="Departamento Id">
            <input type="text" id="descripcion" placeholder="Descripcion">
            <button type="submit">Crear</button>
        </form>

    </main>


    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/cargos.js"></script>
</body>

</html>
