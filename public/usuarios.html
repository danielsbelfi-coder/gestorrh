<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestorRH - Usuarios</title>
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/modal.css">
</head>

<body>
    <main class="contenido" data-titulo="Usuarios">
        <div class="encabezado-pagina">
            <div>
                <h1>Usuarios de la cuenta</h1>
                <p>Quién entra al sistema y con qué rol en cada empresa.</p>
            </div>
        </div>
        <p id="mensajeError" role="alert"></p>
        <p id="mensajeInfo" role="status"></p>

        <div class="rejilla rejilla-ancha">
            <details class="tarjeta plegable" id="panelCrear">
                <summary>＋ Nuevo usuario</summary>
                <form id="formCrearUsuario">
                    <label class="campo-ancho">Nombre<input type="text" id="nombre" required></label>
                    <label class="campo-ancho">Correo<input type="email" id="email" required></label>
                    <button type="submit">Crear usuario</button>
                </form>
            </details>

            <details class="tarjeta plegable" id="panelRol">
                <summary>Asignar o quitar rol por empresa</summary>
                <form id="formRol">
                    <label class="campo-ancho">Usuario<select id="rolUsuario" required></select></label>
                    <label class="campo-ancho">Empresa<select id="rolEmpresa" required></select></label>
                    <label>Rol
                        <select id="rolCodigo">
                            <option value="ADMIN">ADMIN</option>
                            <option value="JEFE_RRHH">JEFE_RRHH</option>
                            <option value="RRHH">RRHH</option>
                            <option value="SUPERVISOR">SUPERVISOR</option>
                            <option value="LECTURA">LECTURA</option>
                        </select>
                    </label>
                    <button type="submit">Asignar rol</button>
                    <button type="button" class="secundario" id="botonQuitarRol">Quitar rol</button>
                </form>
            </details>
        </div>

        <div id="tablaUsuarios"></div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/componentes.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/usuarios.js"></script>
</body>

</html>
